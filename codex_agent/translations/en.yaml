configuration:
  openai_api_key:
    name: OpenAI API key
    description: Optional API key used by Codex CLI.
  openrouter_api_key:
    name: OpenRouter API key
    description: Optional API key used by the embedded SegurAI service.
  ha_long_lived_token:
    name: Home Assistant long-lived token legacy alias
    description: Deprecated alias for home_assistant_token.
  home_assistant_token:
    name: Home Assistant API token
    description: Dedicated long-lived token for Home Assistant API calls.
  mcp_server_url:
    name: MCP server URL
    description: Optional remote Model Context Protocol Server URL.
  mcp_server_api_key:
    name: MCP server API key
    description: Optional API key sent to the remote MCP server.
  codex_model:
    name: Codex model
    description: Model passed to Codex CLI by default.
  codex_home:
    name: Codex home
    description: Persistent home directory for Codex.
  workspace:
    name: Workspace
    description: Default directory where Codex should work.
  web_terminal_enabled:
    name: Web terminal enabled
    description: Enable the Home Assistant sidebar terminal through Ingress.
  require_confirmation:
    name: Require confirmation
    description: Keep manual confirmation enabled for agent actions.
  install_mcp_servers:
    name: Install MCP servers
    description: Generate default filesystem and memory MCP server configuration.
  ssh_enabled:
    name: SSH enabled
    description: Enable SSH access on port 2222.
  ssh_public_keys:
    name: SSH public keys
    description: Public keys allowed to access the agent container.

  segurai_enabled:
    name: SegurAI service enabled
    description: Start SegurAI as a background 24/7 service inside this Codex add-on.
  segurai_web_enabled:
    name: SegurAI web panel enabled
    description: Expose the optional SegurAI web panel on direct port 8098.
  segurai_poll_seconds:
    name: SegurAI poll seconds
    description: Sensor polling interval for the SegurAI service.
  segurai_sensor_prompt:
    name: SegurAI sensor prompt
    description: Prompt used by SegurAI for periodic sensor observation.
  segurai_fs_roots:
    name: SegurAI filesystem roots
    description: Comma-separated writable/readable roots available to SegurAI tools.
  segurai_no_sensor_loop:
    name: Disable SegurAI sensor loop
    description: Start SegurAI without the periodic sensor loop.
  segurai_allow_actions_without_confirmation:
    name: Allow SegurAI actions without confirmation
    description: Permit SegurAI to execute actions without explicit confirmation. Use with care.
