version: 1

# Copy this file to a local data directory and point CODEXON_SITE_PROFILE to it.
# Entity IDs and aliases belong to each Home Assistant installation.
roles:
  lighting.kitchen:
    entity_id: light.kitchen
    label: kitchen light
    aliases:
      - kitchen light

  climate.primary.control:
    entity_id: climate.living_room
    label: primary climate control
    aliases:
      - air conditioning
      - main climate

  climate.primary.temperature:
    entities:
      - sensor.living_room_temperature
    label: indoor temperature

  climate.primary.power:
    entity_id: sensor.hvac_power
    label: climate power

  environment.indoor_light:
    entity_id: sensor.living_room_illuminance
    label: indoor illuminance

  environment.outdoor_radiation:
    entity_id: sensor.outdoor_illuminance
    label: outdoor light or solar radiation

  environment.outdoor_temperature:
    entity_id: sensor.outdoor_temperature
    label: outdoor temperature

  environment.outdoor_humidity:
    entity_id: sensor.outdoor_humidity
    label: outdoor humidity

  environment.outdoor_rain:
    entity_id: sensor.outdoor_rain
    label: rain

  environment.outdoor_wind_speed:
    entity_id: sensor.outdoor_wind_speed
    label: wind speed

  environment.outdoor_wind_gust:
    entity_id: sensor.outdoor_wind_gust
    label: wind gust

  energy.price:
    entity_id: sensor.electricity_price
    label: electricity price

instructions:
  - Resolve natural names through the configured roles before searching Home Assistant.
  - Ask the user to choose when discovery returns multiple equally plausible entities.
