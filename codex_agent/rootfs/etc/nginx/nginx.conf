user root;
worker_processes auto;
pid /tmp/codex-agent-nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    server {
        listen 8099;
        server_name _;

        root /usr/share/codex-agent-portal;
        index index.html;

        location = / {
            try_files /index.html =404;
        }

        location = /health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location /stats/ {
            proxy_pass http://127.0.0.1:8098/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            proxy_read_timeout 300s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @stats_unavailable;

            # SegurAI currently emits browser API calls rooted at /api/.
            # Make them relative so they retain Home Assistant's opaque Ingress prefix.
            sub_filter_once off;
            sub_filter '/api/' 'api/';
        }

        location @stats_unavailable {
            default_type text/html;
            return 200 '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0;padding:3rem;background:#0b1020;color:#e5e7eb;font:16px system-ui}p{color:#94a3b8}</style><h2>Estadísticas no disponibles</h2><p>Activa <code>segurai_web_enabled</code> y reinicia el add-on.</p></html>';
        }

        location /terminal/ {
            proxy_pass http://127.0.0.1:8100/;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_intercept_errors on;
            error_page 502 503 504 = @terminal_unavailable;
        }

        location @terminal_unavailable {
            default_type text/html;
            return 200 '<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><style>body{margin:0;padding:3rem;background:#0b1020;color:#e5e7eb;font:16px system-ui}p{color:#94a3b8}</style><h2>Terminal no disponible</h2><p>Activa <code>web_terminal_enabled</code> y reinicia el add-on.</p></html>';
        }
    }
}
