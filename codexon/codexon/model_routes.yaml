default: openai/gpt-4.1-nano

fallbacks:
  - google/gemini-2.5-flash-lite
  - openrouter/free

priorities:
  cost:
    max_input_price_per_million: 0.15
    max_output_price_per_million: 0.60
  speed:
    prefer:
      - google/gemini-2.5-flash-lite
      - openai/gpt-4.1-nano
  quality:
    prefer:
      - openai/gpt-4.1-nano
      - google/gemini-2.5-flash-lite

routes:
  chat:
    model: deepseek/deepseek-v4-flash-0731
    reason: Conversacion general, contexto recuperado y baja latencia.

  homeassistant:
    model: deepseek/deepseek-v4-flash-0731
    requires_tools: true
    fallbacks:
      - openai/gpt-4.1-mini
      - openai/gpt-4.1-nano
    reason: Interpretacion de sensores y seguimiento de herramientas con coste bajo.

  scheduled_task:
    model: openai/gpt-4.1
    priority: quality
    requires_tools: true
    fallbacks:
      - openai/gpt-4.1-mini
      - openai/gpt-4.1-nano
    reason: Tareas programadas con acciones reales necesitan mejor seguimiento de herramientas y secuencias.

  memory_extraction:
    model: google/gemini-2.5-flash-lite
    reason: Extraccion/sintesis barata.

  summary:
    model: google/gemini-2.5-flash-lite
    reason: Resumen barato.

  classification:
    model: google/gemini-2.5-flash-lite
    reason: Clasificacion barata.

  statistical_planning:
    model: openai/gpt-4.1-mini
    priority: quality
    fallbacks:
      - openai/gpt-4.1-nano
      - google/gemini-2.5-flash-lite
    reason: Separa magnitud, alcance, periodo y atribucion sin depender de frases fijas.

  statistical_reasoning:
    model: deepseek/deepseek-v4-flash-0731
    priority: quality
    requires_tools: true
    fallbacks:
      - openai/gpt-4.1-mini
      - openai/gpt-4.1-nano
    reason: Interpreta resultados calculados por herramientas y deduce relaciones con baja latencia y coste.

  statistical_escalation:
    model: openai/gpt-4.1
    priority: quality
    fallbacks:
      - openai/gpt-4.1-mini
      - deepseek/deepseek-v4-flash-0731
    reason: Revision excepcional de evidencia ambigua o conclusiones estadisticas de alto impacto.

  translation:
    model: qwen/qwen3-32b
    reason: Buen multilingue economico.

  programming:
    model: openai/gpt-4.1-nano
    reason: Programacion ligera economica.

  reasoning:
    model: openai/gpt-4.1-nano
    reason: Razonamiento moderado con coste controlado.
